name: Błąd (bug)
description: Coś nie działa – opisz to tutaj
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: gdzie
    attributes:
      label: Gdzie
      description: Link do strony (podgląd lub produkcja) i ekran
      placeholder: https://...vercel.app/ocena — przycisk „Oblicz”
    validations:
      required: true
  - type: textarea
    id: kroki
    attributes:
      label: Kroki
      placeholder: |
        1. Otworzyłem/am ...
        2. Kliknąłem/am ...
    validations:
      required: true
  - type: textarea
    id: oczekiwane
    attributes:
      label: Oczekiwane / faktyczne
    validations:
      required: true
  - type: dropdown
    id: urzadzenie
    attributes:
      label: Urządzenie
      options:
        - Komputer
        - Telefon
        - Oba
    validations:
      required: true
  - type: dropdown
    id: waznosc
    attributes:
      label: Ważność
      options:
        - Blokuje demo
        - Przeszkadza, ale da się obejść
        - Kosmetyka / tekst
    validations:
      required: true
  - type: textarea
    id: zrzut
    attributes:
      label: Zrzut ekranu (przeciągnij tutaj)
